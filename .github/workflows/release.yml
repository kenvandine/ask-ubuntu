name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string
  release:
    types: [published]

jobs:
  release:
    name: Release ${{ inputs.version }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Error: Release workflow must be dispatched from main, got '${{ github.ref_name }}'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version '${{ inputs.version }}' does not match expected semver format (e.g. 1.2.3)"
            exit 1
          fi

      - name: Bump version in snapcraft.yaml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
          grep "^version:" snap/snapcraft.yaml

      - name: Commit version bump
        run: |
          git add snap/snapcraft.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit. Version may already be set to ${{ inputs.version }} in snap/snapcraft.yaml."
            exit 1
          fi
          git commit -m "chore: release ${{ inputs.version }}"

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin main "v${{ inputs.version }}"

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Publish to candidate channel
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: candidate

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ inputs.version }}`,
              name: `v${{ inputs.version }}`,
              generate_release_notes: true,
              draft: true,
              prerelease: false,
            });

  promote:
    name: Promote snap to stable
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Promote snap from candidate to stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft promote ask-ubuntu --from-channel candidate --to-channel stable --yes
