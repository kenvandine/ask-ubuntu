name: ask-ubuntu
base: core24
version: '0.1.0'
summary: AI-powered Ubuntu assistant with deep system awareness
description: |
  Ask Ubuntu is an AI-powered Ubuntu Linux assistant that answers questions
  about your system in a context-aware way. It collects a detailed snapshot
  of your hardware and software — CPU, GPU, memory, storage, packages, and
  services — so every answer is tailored to your specific machine.

  It can run entirely locally using Lemonade Server, or connect to remote
  cloud providers (Anthropic, OpenAI, Google Gemini, or any
  OpenAI-compatible endpoint such as Ollama). If Lemonade is unavailable
  and a remote provider is configured, fallback is automatic.

  Key features:

    - RAG-powered docs — indexes man pages and Ubuntu help files for
      accurate, referenced answers
    - Live system tools — the LLM queries packages, services, and resource
      usage in real time before answering
    - Desktop GUI (Electron) and interactive terminal CLI
    - Markdown rendering with syntax-highlighted, copyable code blocks
    - Text-to-speech with streaming audio playback (GUI, via Lemonade)
license: GPL-3.0
website: https://github.com/kenvandine/ask-ubuntu
source-code: https://github.com/kenvandine/ask-ubuntu
issues: https://github.com/kenvandine/ask-ubuntu/issues
contact: https://github.com/kenvandine/ask-ubuntu/issues
icon: ask-ubuntu-512.png
grade: stable
confinement: strict

plugs:
  shmem:
    interface: shared-memory
    private: true
  var-lib-dpkg:
    interface: system-files
    read:
      - /var/lib/snapd/hostfs/var/lib/dpkg
  var-lib-apt-lists:
    interface: system-files
    read:
      - /var/lib/snapd/hostfs/var/lib/apt/lists

apps:
  ask-ubuntu:
    command: bin/ask-ubuntu
    plugs:
      - network
      - system-observe
      - hardware-observe
      - desktop-launch
      - var-lib-dpkg
      - var-lib-apt-lists
      - system-packages-doc
  gui:
    command: usr/bin/ask-ubuntu-gui
    desktop: usr/share/applications/ask-ubuntu-gui.desktop
    extensions: [ gnome ]
    plugs:
      - audio-playback
      - network
      - system-observe
      - hardware-observe
      - desktop-launch
      - var-lib-dpkg
      - var-lib-apt-lists
      - system-packages-doc
      - shmem
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  ask-ubuntu:
    plugin: python
    source: .
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/locales"
      cp -a "$CRAFT_PART_SRC/locales/." "$CRAFT_PART_INSTALL/locales/"
    python-requirements:
      - requirements.txt
    build-packages:
      - python3-dev
    stage-packages:
      - pciutils       # lspci for GPU detection with packaged pci.ids
      - libgomp1       # OpenMP runtime required by faiss-cpu

  ask-ubuntu-gui:
    plugin: nil
    source: electron/
    override-build: |
      npm install
      npm run build
      mkdir -p $SNAPCRAFT_PART_INSTALL/unpacked
      mv dist/linux*-unpacked/* $SNAPCRAFT_PART_INSTALL/unpacked
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      cp "$SNAPCRAFT_PROJECT_DIR/electron/ask-ubuntu-gui.desktop" \
         "$CRAFT_PART_INSTALL/usr/share/applications/"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps"
      cp "$SNAPCRAFT_PROJECT_DIR/ask-ubuntu-512.png" \
         "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/"
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      cp "$SNAPCRAFT_PROJECT_DIR/snap/local/ask-ubuntu-gui" \
         "$CRAFT_PART_INSTALL/usr/bin/ask-ubuntu-gui"
      chmod +x "$CRAFT_PART_INSTALL/usr/bin/ask-ubuntu-gui"
    build-packages:
      - nodejs
      - npm
    prime:
      - usr/bin
      - usr/share/icons
      - usr/share/applications
      - unpacked
      - -*/chrome-sandbox
      - -*/resources/app.asar.unpacked/node_modules/sharp/vendor/lib
      - -*/resources/app.asar.unpacked/node_modules/sharp/vendor/include
