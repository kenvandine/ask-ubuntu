<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; font-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:8765 ws://127.0.0.1:8765;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Ubuntu</title>
  <link rel="stylesheet" href="style.css" />
  <!-- highlight.js core only; token colors are styled in local CSS -->
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- ── Sidebar rail (always visible) ───────────────────── -->
    <nav id="sidebar-rail">
      <button id="btn-sidebar-toggle" title="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <rect x="1" y="3" width="14" height="1.5" rx="0.5"/>
          <rect x="1" y="7.25" width="14" height="1.5" rx="0.5"/>
          <rect x="1" y="11.5" width="14" height="1.5" rx="0.5"/>
        </svg>
      </button>
      <div class="rail-spacer"></div>
      <button id="help-btn" title="Help">?</button>
      <button id="model-btn" title="Change model">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <circle cx="8" cy="8" r="3"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.42 1.42M11.53 11.53l1.42 1.42M3.05 12.95l1.42-1.42M11.53 4.47l1.42-1.42" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="new-chat-btn" title="New Chat">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <rect x="7" y="2" width="2" height="12" rx="0.5"/>
          <rect x="2" y="7" width="12" height="2" rx="0.5"/>
        </svg>
      </button>
    </nav>

    <!-- ── Sidebar panel (collapsible) ──────────────────────── -->
    <aside id="sidebar-panel">
      <div class="sidebar-header">
        <img src="ubuntu-logo.svg" class="ubuntu-logo" alt="Ubuntu" />
        <h1>Ask Ubuntu</h1>
      </div>
      <div id="system-info-panel">
        <h2 id="system-info-heading"></h2>
        <p id="system-info-subtitle" class="system-info-subtitle"></p>
        <dl id="system-info-content"><dd></dd></dl>
      </div>
    </aside>

    <!-- ── Main chat area ─────────────────────────────────── -->
    <main id="chat-area">

      <!-- Loading / status overlay -->
      <div id="status-overlay">
        <div class="status-box">
          <div class="spinner"></div>
          <p id="status-text">Starting backend…</p>
          <div id="download-progress" style="display:none;">
            <div id="download-bar-track">
              <div id="download-bar-fill"></div>
            </div>
            <p id="download-detail"></p>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div id="messages"></div>

      <!-- Input bar -->
      <div id="input-bar">
        <textarea
          id="user-input"
          placeholder="Ask something about Ubuntu…"
          rows="1"
          disabled
        ></textarea>
        <button id="send-btn" disabled>Ask</button>
      </div>

    </main>
  </div>

  <!-- marked.js for Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
